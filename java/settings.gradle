plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "stub-auth-java"

apply from: file("../core/gradle/submodule-modules.gradle")

// stub-auth's Java side: a thin Provider module for the plugin-to-host Provider SPI, proven
// dynamically-loadable by ai-java's ProviderRegistry (ServiceLoader over a directory of jars).
//
// :spi is the contract itself, from the core-contracts submodule (../core-contracts from here). It
// is aliased with the project path preserved and only projectDir differing, the ecosystem
// convention, so the same coordinates line up on both sides of the composite build below. A
// provider carries no proxy: the routing engine is a different consumer of this same contract.
includeFromSubmodule ":spi", "core-contracts"

// :js-base - the TeaVM implementations of :spi's host-injected services (SimpleJsonCodec and
// friends), aliased like :spi above so :stub-teavm can reference them with a plain
// project(":js-base") dependency and reuse the source rather than duplicating it.
includeFromSubmodule ":js-base", "core-contracts"

include ":stub-provider"

// :stub-teavm - TeaVM JS export surface over :stub-provider (StubProviderJs) -> generateJavaScript
// emits an ES2015 module (stub-provider.js). Reuses :js-base instead of duplicating it.
include ":stub-teavm"

// :ir - core-ir's canonical IR types + vendor translators (AnthropicTranslator etc.), aliased in
// exactly like :spi/:js-base above so stub-provider can build its canned response through
// core-ir instead of hand-writing Anthropic-format JSON. core-ir is a DIRECT submodule of
// stub-auth (../core-ir from here, i.e. stub-auth/core-ir).
includeFromSubmodule ":ir", "core-ir"

// ---- test-only composite build -------------------------------------------------------------
// Pulls ai-java's own Gradle build in so stub-provider's integration test can construct a real
// AiJava/ProviderRegistry and route a request through the jar this build produces -- proving
// dynamic loading end-to-end without ai-java ever being told stub-auth exists (pure ServiceLoader
// discovery). This is a LOCAL DEV-ONLY path: ai-java is not published anywhere, so this only
// works when both repos are checked out side by side on the same machine. Override the location
// with -PaiJavaDir=<path> if your checkout isn't at the default.
//
// Gradle composite builds keep each build's project-path namespace separate, so ai-java's own
// (differently-aliased) ":routing" project inside its included build does not collide with the
// ":routing" this settings.gradle declares above -- they're resolved via group:module dependency
// substitution (io.github.intisy:jvm), not by project path.
def aiJavaDir = file(providers.gradleProperty("aiJavaDir").getOrElse("F:/Documents/GitHub/ai/java/ai-java"))
if (aiJavaDir.isDirectory()) {
    includeBuild(aiJavaDir)
} else {
    logger.warn("stub-auth java: ai-java not found at ${aiJavaDir} -- the includeBuild-based " +
            "integration test (StubProviderIntegrationTest) will fail to resolve io.github.intisy:jvm. " +
            "Pass -PaiJavaDir=<path-to-ai-java> to point at a different checkout.")
}
